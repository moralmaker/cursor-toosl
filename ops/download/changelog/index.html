<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor TOOLS · 更新日志</title>
  <meta name="description" content="Cursor TOOLS 各版本更新记录。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #10131a;
      --ink-elevated: #171c26;
      --paper: #f3efe6;
      --paper-muted: #c9c2b4;
      --brass: #d4a24c;
      --line: color-mix(in srgb, var(--paper) 12%, transparent);
      --font-display: "Instrument Serif", "Noto Serif SC", Georgia, serif;
      --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--paper);
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(212, 162, 76, 0.16), transparent 55%),
        linear-gradient(165deg, #0d1016 0%, var(--ink) 50%, #0a0c11 100%);
      display: flex;
      flex-direction: column;
    }
    a { color: var(--brass); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .nav-bar {
      flex: 0 0 auto;
      z-index: 40;
      backdrop-filter: blur(18px);
      background: color-mix(in srgb, var(--ink) 82%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }
    .brand-mark { font-family: var(--font-display); font-size: 1.35rem; color: var(--paper); }
    .brand-mark em { font-style: italic; color: var(--brass); }
    .nav-links { display: flex; gap: 18px; font-size: 0.92rem; }
    .nav-links a { color: var(--paper-muted); }
    .nav-links a:hover { color: var(--paper); text-decoration: none; }
    .layout {
      flex: 1 1 auto;
      min-height: 0;
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 200px;
      gap: 0;
    }
    .rail, .toc {
      min-height: 0;
      overflow: auto;
      padding: 24px 16px 48px 0;
    }
    .toc { padding: 24px 0 48px 18px; }
    .pane {
      min-height: 0;
      overflow: auto;
      padding: 28px 28px 80px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .rail-title, .toc-title {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: none;
      color: var(--paper-muted);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .versions {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 2px;
    }
    .versions::before {
      content: "";
      position: absolute;
      left: 17px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: var(--line);
    }
    .ver-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--paper-muted);
      text-align: left;
      padding: 8px 10px 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      position: relative;
    }
    .ver-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: color-mix(in srgb, var(--paper-muted) 55%, transparent);
      box-shadow: 0 0 0 4px var(--ink);
      z-index: 1;
    }
    .ver-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92rem;
    }
    .ver-tag {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--brass) 50%, transparent);
      color: var(--brass);
      font-family: var(--font-body);
    }
    .ver-btn:hover { color: var(--paper); background: color-mix(in srgb, var(--paper) 6%, transparent); }
    .ver-btn.active {
      color: #1a120a;
      background: var(--brass);
      font-weight: 600;
    }
    .ver-btn.active .ver-dot {
      background: #1a120a;
      box-shadow: 0 0 0 4px var(--brass);
    }
    .ver-btn.active .ver-tag {
      color: #1a120a;
      border-color: color-mix(in srgb, #1a120a 35%, transparent);
    }
    .article-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 8px;
    }
    .article-head .ver {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.2rem;
      color: var(--brass);
    }
    .article-head .date { color: var(--paper-muted); font-size: 0.92rem; }
    h1.title {
      margin: 0 0 22px;
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .content { line-height: 1.78; color: color-mix(in srgb, var(--paper) 92%, transparent); }
    .content h1, .content h2, .content h3 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--paper);
      margin: 1.7em 0 0.55em;
      scroll-margin-top: 18px;
    }
    .content h2 { font-size: 1.5rem; }
    .content h3 { font-size: 1.2rem; }
    .content p { margin: 0 0 1em; }
    .content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1em 0;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .content ul, .content ol { margin: 0 0 1em; padding-left: 1.3em; }
    .content li { margin: 0.35em 0; }
    .content blockquote {
      margin: 1.2em 0;
      padding: 12px 16px;
      border-left: 3px solid var(--brass);
      background: color-mix(in srgb, var(--ink-elevated) 80%, transparent);
      color: var(--paper-muted);
    }
    .content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      padding: 0.1em 0.35em;
      border-radius: 6px;
      background: color-mix(in srgb, var(--paper) 8%, transparent);
    }
    .content .table-wrap { overflow-x: auto; margin: 1.2em 0; }
    .content table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .content th, .content td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .content th { color: var(--paper-muted); font-weight: 500; }
    .actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 16px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--paper); text-decoration: none;
      background: color-mix(in srgb, var(--ink-elevated) 80%, transparent);
    }
    .btn-primary { background: var(--brass); color: #1a120a; border-color: transparent; }
    .btn:hover { text-decoration: none; filter: brightness(1.05); }
    .toc a {
      display: block;
      color: var(--paper-muted);
      font-size: 0.86rem;
      line-height: 1.4;
      padding: 6px 0;
      text-decoration: none;
    }
    .toc a:hover, .toc a.active { color: var(--brass); }
    .toc a.h3 { padding-left: 12px; font-size: 0.82rem; }
    .empty, .error { color: var(--paper-muted); padding: 24px 0; }
    .mobile-select {
      display: none;
      width: 100%;
      margin: 16px 0 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--ink-elevated);
      color: var(--paper);
      font: inherit;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; width: min(100% - 28px, 1280px); }
      .rail { padding: 16px 0 0; overflow: visible; }
      .toc { display: none; }
      .pane { border: 0; padding: 8px 0 64px; overflow: visible; }
      .mobile-select { display: block; }
      .versions { display: none; }
      body { height: auto; display: block; }
    }
  </style>
</head>
<body>
  <header class="nav-bar">
    <div class="nav-inner">
      <a class="brand-mark" href="/download/">Cursor <em>TOOLS</em></a>
      <nav class="nav-links">
        <a href="/download/">下载</a>
        <a href="/download/guide.html">使用帮助</a>
        <a href="/download/changelog/">更新日志</a>
      </nav>
    </div>
  </header>
  <div class="layout">
    <aside class="rail">
      <p class="rail-title">版本列表</p>
      <select class="mobile-select" id="mobile-versions" aria-label="选择版本"></select>
      <div class="versions" id="versions"><p class="empty">加载中…</p></div>
    </aside>
    <section class="pane" id="pane">
      <p class="empty">加载中…</p>
    </section>
    <aside class="toc">
      <p class="toc-title" id="toc-title">本页目录</p>
      <nav id="toc"></nav>
    </aside>
  </div>
  <script>
    const cache = new Map();
    let items = [];
    let current = "";

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value.slice(0, 10);
      return d.toISOString().slice(0, 10);
    }

    function versionFromPath() {
      const match = location.pathname.match(/\/download\/changelog\/([^/]+)\/?$/);
      const raw = match ? decodeURIComponent(match[1]) : "";
      return raw && raw !== "index.html" ? raw : "";
    }

    function pathFor(version) {
      return "/download/changelog/" + encodeURIComponent(version) + "/";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderList() {
      const root = document.getElementById("versions");
      const select = document.getElementById("mobile-versions");
      root.innerHTML = items.map((item, index) => `
        <button class="ver-btn${item.version === current ? " active" : ""}" type="button" data-version="${escapeHtml(item.version)}">
          <span class="ver-dot" aria-hidden="true"></span>
          <span class="ver-label">v${escapeHtml(item.version)}</span>
          ${index === 0 ? '<span class="ver-tag">最新</span>' : ""}
        </button>
      `).join("");
      select.innerHTML = items.map((item) =>
        `<option value="${escapeHtml(item.version)}"${item.version === current ? " selected" : ""}>v${escapeHtml(item.version)}</option>`
      ).join("");
    }

    function renderToc(html) {
      const toc = document.getElementById("toc");
      const title = document.getElementById("toc-title");
      const headings = [...new DOMParser().parseFromString(html, "text/html").querySelectorAll("h2, h3")];
      title.textContent = current ? `在 v${current} 中` : "本页目录";
      toc.innerHTML = headings.map((el) =>
        `<a class="${el.tagName.toLowerCase()}" href="#${escapeHtml(el.id)}">${escapeHtml(el.textContent || "")}</a>`
      ).join("");
    }

    function renderDetail(data) {
      const pane = document.getElementById("pane");
      document.title = "Cursor TOOLS · " + data.title;
      pane.innerHTML = `
        <div class="article-head">
          <span class="ver">v${escapeHtml(data.version)}</span>
          <span class="date">${formatDate(data.pubDate)}</span>
        </div>
        <h1 class="title">${escapeHtml(data.title)}</h1>
        <article class="content">${data.html}</article>
        <div class="actions">
          <a class="btn btn-primary" href="/download/">下载最新版</a>
        </div>
      `;
      renderToc(data.html);
      pane.scrollTop = 0;
    }

    async function loadDetail(version, push) {
      if (!version) return;
      current = version;
      renderList();
      if (push) history.pushState({ version }, "", pathFor(version));
      const pane = document.getElementById("pane");
      if (!cache.has(version)) {
        pane.innerHTML = '<p class="empty">加载中…</p>';
        const response = await fetch("/api/v1/changelog/" + encodeURIComponent(version));
        if (!response.ok) {
          pane.innerHTML = '<p class="error">未找到该版本的更新记录。</p>';
          document.getElementById("toc").innerHTML = "";
          return;
        }
        cache.set(version, await response.json());
      }
      renderDetail(cache.get(version));
    }

    async function main() {
      try {
        const response = await fetch("/api/v1/changelog");
        if (!response.ok) throw new Error("HTTP " + response.status);
        items = (await response.json()).items || [];
        if (!items.length) {
          document.getElementById("versions").innerHTML = '<p class="empty">暂无公开的更新记录。</p>';
          document.getElementById("pane").innerHTML = '<p class="empty">暂无内容。</p>';
          return;
        }
        const requested = versionFromPath();
        const initial = items.some((item) => item.version === requested) ? requested : items[0].version;
        if (!requested) history.replaceState({ version: initial }, "", pathFor(initial));
        await loadDetail(initial, false);
      } catch (error) {
        document.getElementById("pane").innerHTML = '<p class="error">加载失败，请稍后重试。</p>';
        console.error(error);
      }
    }

    document.getElementById("versions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-version]");
      if (!button) return;
      const version = button.getAttribute("data-version");
      if (version && version !== current) void loadDetail(version, true);
    });
    document.getElementById("mobile-versions").addEventListener("change", (event) => {
      const version = event.target.value;
      if (version && version !== current) void loadDetail(version, true);
    });
    document.getElementById("toc").addEventListener("click", (event) => {
      const link = event.target.closest("a[href^='#']");
      if (!link) return;
      event.preventDefault();
      const id = decodeURIComponent(link.getAttribute("href").slice(1));
      document.getElementById("pane").querySelector("#" + CSS.escape(id))?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    window.addEventListener("popstate", () => {
      const version = versionFromPath() || items[0]?.version;
      if (version) void loadDetail(version, false);
    });

    main();
  </script>
</body>
</html>
